<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F87171" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#ng)" />
  
  <g fill="rgba(255,255,255,0.25)" filter="url(#shadow)">
    <!-- Skyline & Beach -->
    <path d="M0,420 Q256,380 512,420 L512,512 L0,512 Z" />
    <rect x="80" y="240" width="60" height="200" />
    <rect x="160" y="160" width="80" height="280" />
    <rect x="260" y="200" width="70" height="240" />
    <rect x="350" y="280" width="50" height="160" />
    <!-- Sun/Moon -->
    <circle cx="400" cy="120" r="40" opacity="0.4" />
  </g>
  
  <g fill="rgba(255,255,255,0.4)">
    <circle cx="256" cy="256" r="160" opacity="0.1" />
    <circle cx="256" cy="256" r="220" opacity="0.05" />
  </g>
</svg>
