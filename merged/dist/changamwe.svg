<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#cg)" />
  
  <g fill="rgba(255,255,255,0.25)" filter="url(#shadow)">
    <!-- Crane structure -->
    <path d="M140,400 L140,150 L400,150 L400,120 L110,120 L110,400 Z" />
    <path d="M180,150 L260,300 L280,300 L200,150 Z" />
    
    <!-- Containers -->
    <rect x="250" y="320" width="120" height="80" rx="4" />
    <rect x="270" y="240" width="100" height="80" rx="4" />
    <rect x="380" y="340" width="80" height="60" rx="4" />
  </g>
  
  <g fill="rgba(255,255,255,0.4)">
    <circle cx="256" cy="256" r="160" opacity="0.1" />
    <circle cx="256" cy="256" r="220" opacity="0.05" />
  </g>
</svg>
