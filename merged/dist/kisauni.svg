<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#kg)" />
  
  <g fill="rgba(255,255,255,0.25)" filter="url(#shadow)">
    <!-- Palm Tree & Beach -->
    <path d="M0,400 Q256,350 512,400 L512,512 L0,512 Z" />
    <path d="M220,400 Q240,250 280,150 Q260,250 250,400 Z" />
    <!-- Palm leaves -->
    <path d="M280,150 Q200,100 150,180 Q220,150 280,150 Z" />
    <path d="M280,150 Q360,100 410,180 Q340,150 280,150 Z" />
    <path d="M280,150 Q250,50 300,50 Q280,100 280,150 Z" />
    <circle cx="360" cy="140" r="40" opacity="0.5" />
  </g>
  
  <g fill="rgba(255,255,255,0.4)">
    <circle cx="256" cy="256" r="160" opacity="0.1" />
    <circle cx="256" cy="256" r="220" opacity="0.05" />
  </g>
</svg>
